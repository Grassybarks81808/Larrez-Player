[package]
name = "larrez-player"
version = "0.1.1"
edition = "2021"
description = "Larrez Player - a lightweight multi-format video player powered by libmpv"
authors = ["Larrez"]
license = "MIT"

[[bin]]
name = "larrez-player"
path = "src/main.rs"

[dependencies]
# Windowing + input. We hand mpv the raw HWND and let it render itself,
# so we never touch a GPU context ourselves.
winit = { version = "0.29", features = ["rwh_05"] }
raw-window-handle = "0.5"
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[build-dependencies]
# Embeds the icon + version metadata into the .exe on Windows.
winres = "0.1"

[profile.release]
# Small, fast binary: LTO, single codegen unit, panic=abort, strip symbols.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
