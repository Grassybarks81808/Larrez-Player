name: Windows Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (for example v0.3.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 executable
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build release executable
        run: cargo build --manifest-path native/Cargo.toml --release --target x86_64-pc-windows-msvc

      - name: Package Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "native/target/x86_64-pc-windows-msvc/release/larrez-player.exe"
          if (!(Test-Path $exe)) {
            throw "Expected executable was not produced: $exe"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe "dist/Larrez-Player-Windows-x64.exe"
          @(
            "Larrez Player — Windows x64",
            "",
            "Run Larrez-Player-Windows-x64.exe on 64-bit Windows.",
            "The native player loads mpv-2.dll at runtime for media playback. If that DLL is not bundled with your distribution, install/copy a compatible mpv Windows runtime DLL beside the executable.",
            "",
            "Source: https://github.com/Grassybarks81808/Larrez-Player"
          ) | Set-Content -Encoding utf8 "dist/README-Windows.txt"
          Compress-Archive -Path "dist/Larrez-Player-Windows-x64.exe","dist/README-Windows.txt" -DestinationPath "Larrez-Player-Windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Larrez-Player-Windows-x64
          path: |
            dist/Larrez-Player-Windows-x64.exe
            dist/README-Windows.txt
            Larrez-Player-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Larrez Player ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Larrez-Player-Windows-x64.exe
            dist/README-Windows.txt
            Larrez-Player-Windows-x64.zip

      - name: Create release from manual run
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Larrez Player ${{ inputs.tag_name }}
          target_commitish: main
          generate_release_notes: true
          files: |
            dist/Larrez-Player-Windows-x64.exe
            dist/README-Windows.txt
            Larrez-Player-Windows-x64.zip
